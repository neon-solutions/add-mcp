    <rect x="3" y="3" width="58" height="58" rx="13" fill="none" stroke="#09090b" stroke-width="5"/>
    <path d="M25 46.5 40 17.5" stroke="#09090b" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>
  <text x="78" y="285" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="96" font-weight="700" fill="#09090b">add-mcp</text>
